name: Myntra Hoodie Stock Watch

on:
  schedule:
    - cron: "*/45 * * * *"   # every 45 minutes (~960 runs/month, fits within free proxy limits)
  workflow_dispatch:          # lets you run manually from Actions tab
  push:                       # runs on git push to verify code changes

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run stock check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPE_DO_TOKEN:    ${{ secrets.SCRAPE_DO_TOKEN }}
          SCRAPER_API_KEY:    ${{ secrets.SCRAPER_API_KEY }}
        run: python check_stock.py
